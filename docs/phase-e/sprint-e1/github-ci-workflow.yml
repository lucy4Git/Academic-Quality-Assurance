name: AQAA CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Python 3.13
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa_ci
          POSTGRES_DB: aqaa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      DATABASE_URL: postgresql+asyncpg://aqaa:aqaa_ci@localhost:5432/aqaa_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q --tb=short

      - name: Check for weak secrets in source
        run: |
          if grep -r "change-me-to-a-long-random-string\|SECRET_KEY=aqaa\|SECRET_KEY=secret" \
            --include="*.py" --include="*.env.example" --exclude-dir=".git" .; then
            echo "::error::Weak or default SECRET_KEY found in source"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript + ESLint + Build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx next lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx next build

  # ---------------------------------------------------------------------------
  # Playwright E2E (runs against the synthetic dev stack)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'  # run on push only (not PRs from forks)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa_ci
          POSTGRES_DB: aqaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      DATABASE_URL: postgresql+asyncpg://aqaa:aqaa_ci@localhost:5432/aqaa
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # E2E synthetic test credentials (stored as GitHub secrets — never in source)
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations and seed
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python ../database/seed_data/run_all.py

      - name: Start backend
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        env:
          DATABASE_URL: postgresql+asyncpg://aqaa:aqaa_ci@localhost:5432/aqaa

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build and start frontend
        working-directory: frontend
        run: |
          npx next build
          npx next start -p 3000 &
          sleep 5

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
