# Render deployment configuration for AQAA
# https://render.com/docs/yaml-spec
#
# Deploys:
#   - aqaa-backend  Web Service (FastAPI)
#   - aqaa-worker   Background Worker (ARQ)
#
# Prerequisites (set in Render Dashboard → Environment):
#   DATABASE_URL, REDIS_URL, QDRANT_URL, QDRANT_API_KEY,
#   SECRET_KEY, METRICS_API_KEY,
#   S3_BUCKET, S3_REGION, S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   CORS_ORIGINS, AI_PROVIDER (+ provider key if not LOCAL_DEV),
#   ANTHROPIC_API_KEY or OPENAI_API_KEY (optional — required for live AI features)

services:
  # --------------------------------------------------------------------------
  # Backend API (FastAPI / Uvicorn)
  # --------------------------------------------------------------------------
  - type: web
    name: aqaa-backend
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # preDeployCommand runs after build but before startCommand receives traffic.
    # DATABASE_URL is read from the protected Render environment variable — never
    # placed in terminal commands or documentation.
    preDeployCommand: python -m alembic upgrade head

    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.0"

      # Secrets — set via Render Dashboard (never committed)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: METRICS_API_KEY
        sync: false

      # Storage (Cloudflare R2 or AWS S3)
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # CORS — set to Vercel frontend URL after deploy, e.g.:
      # https://aqaa-staging.vercel.app,http://localhost:3000
      - key: CORS_ORIGINS
        sync: false

      # AI Provider (set to LOCAL_DEV for staging without a real provider)
      - key: AI_PROVIDER
        value: LOCAL_DEV
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # Background Worker (ARQ)
  # --------------------------------------------------------------------------
  - type: worker
    name: aqaa-worker
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: python -m arq app.worker.WorkerSettings

    envVars:
      - key: APP_ENV
        value: staging
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AI_PROVIDER
        value: LOCAL_DEV
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
