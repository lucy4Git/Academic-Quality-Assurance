[alembic]
# Path to migration scripts, relative to this ini file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps embedded in migration filenames/headers.
timezone = UTC

# Max length for slugs appended to migration filenames.
truncate_slug_length = 40

# Don't add an entry to version_locations for the default `versions` dir.
# version_locations = %(here)s/alembic/versions

# Search path additions when running `alembic` from elsewhere.
prepend_sys_path = .

# Real connection URL is injected at runtime by `alembic/env.py` from
# `app.config.settings.DATABASE_URL` — this placeholder keeps `alembic.ini`
# free of environment-specific secrets.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Hooks (e.g. black/ruff formatting of generated revisions) can be added here
# in a later stage once the project's lint/format tooling is finalized.


# --- Logging configuration ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
