# Render deployment configuration for AQAA
# https://render.com/docs/yaml-spec
#
# Free-tier notes
# ---------------
# preDeployCommand is NOT available on plan: free for web services — it is a
# paid-tier feature only.  Migrations are therefore run manually via Render
# Shell after the first deploy.  See docs/phase-e/sprint-e2/staging-deployment-guide.md
# for the one-time migration procedure.
#
# When upgrading to a paid plan, uncomment the following line in the web
# service block below and remove this comment:
#   preDeployCommand: python -m alembic upgrade head
#
# STORAGE_BACKEND is set to "local" for initial free-tier staging.  The local
# backend writes to Render's ephemeral filesystem — files do not survive
# service restarts.  This is acceptable for health-check and auth validation
# only.  Persistent file uploads require a provisioned S3-compatible bucket
# (Backblaze B2 recommended — no payment card required).  Until that provider
# is approved and credentials are set, STORAGE_BACKEND=local must remain and
# file-upload functionality is a known deployment blocker.
#
# ARQ background worker (aqaa-worker) uses plan: free.  Render does offer free
# background workers but they auto-sleep after 15 min of inactivity; queued
# jobs resume when the worker wakes.  If the worker plan is unavailable or
# rejected during Blueprint apply, remove the worker service block and document
# background-job execution as pending.
#
# Protected environment variables (set in Render Dashboard, never committed):
#   DATABASE_URL, REDIS_URL, QDRANT_URL, QDRANT_API_KEY,
#   SECRET_KEY, METRICS_API_KEY,
#   S3_BUCKET, S3_REGION, S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   CORS_ORIGINS, AI_PROVIDER (+ provider key if not LOCAL_DEV),
#   ANTHROPIC_API_KEY or OPENAI_API_KEY (optional — required for live AI features)

services:
  # --------------------------------------------------------------------------
  # Backend API (FastAPI / Uvicorn)
  # --------------------------------------------------------------------------
  - type: web
    name: aqaa-backend
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # preDeployCommand (paid plans only) — DO NOT uncomment on plan: free:
    #   preDeployCommand: python -m alembic upgrade head
    #
    # Free-tier migration procedure: after the first deploy, open Render Shell
    # for this service and run:
    #   python scripts/run_migrations.py
    # DATABASE_URL is already set in the service environment — do not pass it
    # as an argument or display it.

    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.0"

      # Secrets — set via Render Dashboard (never committed)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: METRICS_API_KEY
        sync: false

      # Object storage
      # DEPLOYMENT BLOCKER: set to "local" until a S3-compatible provider is
      # approved and credentials are available.  Local backend is ephemeral —
      # uploaded files do not survive restarts.  Switch to "s3" only after
      # S3_BUCKET, S3_ENDPOINT_URL, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      # are all set as protected environment variables in Render Dashboard.
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # CORS — set to Vercel frontend URL after deploy, e.g.:
      # https://aqaa-staging.vercel.app,http://localhost:3000
      - key: CORS_ORIGINS
        sync: false

      # AI Provider (set to LOCAL_DEV for staging without a real provider)
      - key: AI_PROVIDER
        value: LOCAL_DEV
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # Background Worker (ARQ)
  # Note: if Render rejects plan: free for this worker type during Blueprint
  # apply, remove this block and document ARQ worker as a pending deployment.
  # Do not select a paid plan to unblock it.
  # --------------------------------------------------------------------------
  - type: worker
    name: aqaa-worker
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: python -m arq app.worker.WorkerSettings

    envVars:
      - key: APP_ENV
        value: staging
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AI_PROVIDER
        value: LOCAL_DEV
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
